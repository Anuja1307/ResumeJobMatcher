services:

  frontend:
    image: anuja1307/resume-frontend:latest
    container_name: resume-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  backend:
    image: anuja1307/resume-backend:latest
    container_name: resume-backend
    expose:
      - "3000"
    restart: unless-stopped
    env_file:
      - ./server/.env.aws
    environment:
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
    depends_on:
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  ai:
    image: anuja1307/resume-ai:latest
    container_name: resume-ai
    expose:
      - "8000"
    restart: unless-stopped
    env_file:
      - ./ai/.env.aws
    environment:
      AI_PROVIDER: openai
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  redis:
    image: redis:7
    container_name: resume-redis
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8

networks:
  app-network:
    driver: bridge
